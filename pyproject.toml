[project]
name = "test-shop-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sun", email = "123456@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "fastmcp==4.1.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
redis = ["redis>=5.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8,<9",
    "ruff>=0.6",
]

[project.scripts]
test-shop-mcp = "shop.api.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shop"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
